# Render 블루프린트: 이 파일이 있으면 Render가 설정을 자동으로 읽어요.
services:
  - type: web
    name: carrot-cc
    runtime: node
    plan: starter         # 무료 한도 초과로 정지돼서 starter(월 $7)로 업그레이드
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: CHANNELS     # 채널 개수
        value: "50"
      - key: CAPACITY     # 채널당 정원
        value: "30"
      - key: DONATE_KAKAO # 카카오페이 송금코드 링크
        value: "https://qr.kakaopay.com/Ej7scKxyb1f408173"
