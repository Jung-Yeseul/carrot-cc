# Render 블루프린트: 이 파일이 있으면 Render가 설정을 자동으로 읽어요.
services:
  - type: web
    name: carrot-cc
    runtime: node
    plan: free            # 정식 오픈 땐 starter(월 $7)로 올리면 잠들지 않아요
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: CHANNELS     # 채널 개수
        value: "50"
      - key: CAPACITY     # 채널당 정원
        value: "30"
